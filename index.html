<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>prmditya</title>

<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
<link rel="icon" href="/favicon.ico" type="image/x-icon">

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background-color: #000;
    color: #fff;
}

body {
    min-height: 100vh;
    font-family: "courier";
}

a {
    color: #fff15c;
    text-decoration: none;
}

a:hover {
    color: #9f9739;
    text-decoration: underline;
}

#main {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

#timezone {
    font-size: 18px;
}

#contact {
  position: fixed;
  left: 16px;
  bottom: 20px;
  font-size: 14px;
  color: #666;
  text-align: left;
  line-height: 1.35;
}

#contact .address {
    margin-top: 8px;
}

.custom-gradient {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(#fbf6c0,#fbf6c0 3px,#0000 0 3px) 0 0/100% 7px;
    opacity: .05;
    z-index: 0;
    pointer-events: none;
}

</style>

<script>
const formatter = new Intl.DateTimeFormat([], {
    timeZone: "Asia/Jakarta",
    hour: "numeric",
    minute: "numeric",
    second: "numeric",
    timeZoneName: "short"
});

function updateTime() {
    const parts = formatter.formatToParts(new Date());

    document.getElementById("time").textContent =
        parts
            .filter(part => part.type !== "timeZoneName")
            .map(part => part.value)
            .join("");

    document.getElementById("tz").textContent =
        parts.find(part => part.type === "timeZoneName").value;
}

window.onload = () => {
    updateTime();
    setInterval(updateTime, 1000);
};
</script>

</head>

<body>
<div class="custom-gradient"></div>

<div id="main">
    <div>

                <span id="tz">WIB</span>
            </i>
        </span>

</div>

<div id="contact">

    <div class="address">
        sidoarjo, east java<br>
        indonesia
    </div>
</div>

</body>
